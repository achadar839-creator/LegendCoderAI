name: Build Legend Coder APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake gettext libltdl-dev
          pip install --upgrade pip "setuptools<69.0.0" wheel
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Accept Android Licenses & Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          yes | sdkmanager --licenses || true
          buildozer -v android debug
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendCoderAI-APK
          path: bin/*.apk
          if-no-files-found: error
