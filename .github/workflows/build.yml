name: Build Cosmic Coder APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake gettext libltdl-dev
          pip install --upgrade "pip<24.0" "setuptools<69.0.0" wheel
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Accept Android Licenses & Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug
        env:
          DEBIAN_FRONTEND: noninteractive
          CI: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cosmic-Coder-APK
          path: bin/*.apk
